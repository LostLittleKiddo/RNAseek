# ============================================================
# RNAseek Docker Compose — Production Stack
# ============================================================
# Services:
#   web     — Daphne ASGI server (HTTP + WebSocket)
#   worker  — Celery workers (bioinformatics pipeline execution)
#   beat    — Celery Beat scheduler (nightly purge_expired)
#   redis   — Message broker + result backend
#   tusd    — Tus resumable upload daemon (high-speed file uploads)
#
# All services that touch pipeline data mount the shared NFS
# volume at /app/media/ so uploads and results are visible
# across web and worker containers with zero data movement.
# ============================================================

x-app-common: &app-common
  build: .
  env_file: .env
  environment:
    - DJANGO_SETTINGS_MODULE=config.settings
    - RNASEEK_ENV=production
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - MEDIA_ROOT=/app/media
  volumes:
    # Shared NFS mount — every container reads/writes the same path.
    # In production, replace this with an NFS or EFS mount:
    #   nfs-data:/app/media
    - media-data:/app/media
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── Daphne ASGI Web Server ──
  # Handles HTTP requests and WebSocket connections for live
  # progress bars via Django Channels.
  web:
    <<: *app-common
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "${RNASEEK_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker Fleet ──
  # Strictly executes bioinformatics pipelines (HISAT2, featureCounts,
  # DESeq2 via rpy2, etc.). Does NOT run a web server.
  worker:
    <<: *app-common
    command: >
      celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=50
    # Workers need more memory for genome alignment (HISAT2 on 44GB genomes)
    deploy:
      resources:
        limits:
          memory: 32G
    healthcheck:
      test: [ "CMD", "celery", "-A", "config", "inspect", "ping" ]
      interval: 60s
      timeout: 30s
      retries: 3

  # ── Celery Beat Scheduler ──
  # Triggers periodic tasks (e.g., purge_expired_sessions at 2:00 AM).
  beat:
    <<: *app-common
    command: >
      celery -A config beat --loglevel=info

    # Only one beat instance should ever run
    deploy:
      replicas: 1

  # ── Redis 7+ Message Broker ──
  # In-memory queue for Celery job dispatch + Django Channels
  # WebSocket layer.
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Tus Upload Daemon (tusd) ──
  # Handles resumable file uploads via the Tus protocol.
  # Nginx routes /files/ here. Writes directly to the shared
  # NFS media volume so Django/workers can access uploaded files.
  tusd:
    image: tusproject/tusd:v2
    command:
      - -host=0.0.0.0
      - -port=1080
      - -upload-dir=/app/media/uploads
      - -base-path=/files/
      # Hook URL: tusd notifies Django when an upload completes
      # so it can register the FileAsset in the database.
      - -hooks-http=http://web:8000/api/tusd-hooks/
      - -hooks-http-forward-headers=Cookie,X-Session-ID
      # Behind a reverse proxy — trust X-Forwarded-* headers.
      - -behind-proxy
      # Maximum upload size: 0 = unlimited (matches Nginx setting).
      - -max-size=0
    ports:
      - "127.0.0.1:1080:1080"
    volumes:
      - media-data:/app/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:1080/files/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  # Shared media volume — in production, replace with an NFS driver:
  #   media-data:
  #     driver: local
  #     driver_opts:
  #       type: nfs
  #       o: addr=<NFS_SERVER_IP>,rw,nfsvers=4.1,async,noatime,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2
  #       device: ":/exports/rnaseek"
  #
  # NFS mount flag explanation:
  #   async      - Client ACKs writes before server confirms (big throughput gain)
  #   noatime    - Skip access time updates on every read (reduces metadata I/O)
  #   rsize/wsize=1048576 - 1MB read/write blocks (matches tusd chunk I/O pattern)
  #   hard       - Retry indefinitely on NFS timeout (prevents data loss)
  #   timeo=600  - 60s timeout before retry (generous for loaded NFS)
  #   retrans=2  - Retry twice before marking hard error
  media-data:
  redis-data:
