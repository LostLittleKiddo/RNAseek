# ============================================================
# RNAseek — Production Auto-Deploy
# ============================================================
# Triggered on push to the prod branch. SSHs into the
# production server and runs the deploy script.
#
# Required GitHub Secrets:
#   DEPLOY_SSH_KEY  — Private SSH key for deploy user
#   DEPLOY_HOST     — Server hostname or IP
#   DEPLOY_USER     — SSH user (default: ubuntu)
# ============================================================

name: Deploy to Production

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/apps/rnaseek

            # Pull latest prod
            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            # Run deploy script
            source /opt/miniconda3/etc/profile.d/conda.sh
            conda activate rnaseek
            bash deploy.sh
