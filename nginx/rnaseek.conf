# ============================================================
# Nginx — RNAseek Production (rnaseek.ca)
# ============================================================
# Install: sudo ln -s /home/ubuntu/apps/rnaseek/nginx/rnaseek.conf /etc/nginx/sites-enabled/rnaseek.conf
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rnaseek.ca www.rnaseek.ca;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rnaseek.ca www.rnaseek.ca;

    # ── SSL (Let's Encrypt / Certbot) ──
    ssl_certificate /etc/letsencrypt/live/rnaseek.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rnaseek.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Limits ──
    client_max_body_size 10G;
    client_body_timeout 300s;

    # ── Static files (served directly by Nginx, bypasses Django) ──
    location /static/ {
        alias /home/ubuntu/apps/rnaseek/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Tus uploads → tusd microservice (bypasses Django entirely) ──
    location /files/ {
        proxy_pass http://tusd:1080/files/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Tus protocol headers
        proxy_set_header Tus-Resumable     $http_tus_resumable;
        proxy_set_header Upload-Length      $http_upload_length;
        proxy_set_header Upload-Offset     $http_upload_offset;
        proxy_set_header Upload-Metadata   $http_upload_metadata;
        proxy_set_header Upload-Concat     $http_upload_concat;
        proxy_set_header Upload-Defer-Length $http_upload_defer_length;

        # Disable Nginx request buffering — stream bytes directly to tusd
        proxy_request_buffering off;
        proxy_buffering         off;
        client_max_body_size    0;

        # Generous timeouts for large files
        proxy_read_timeout  7200s;
        proxy_send_timeout  7200s;

        # CORS for Tus (Uppy needs these)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, HEAD, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Tus-Resumable, Upload-Length, Upload-Metadata, Upload-Offset, Upload-Concat, Upload-Defer-Length, X-HTTP-Method-Override, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Upload-Offset, Upload-Length, Location, Tus-Resumable, Tus-Version, Tus-Extension, Tus-Max-Size" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Expose Tus response headers to browser
        add_header Access-Control-Expose-Headers "Upload-Offset, Upload-Length, Location, Tus-Resumable, Tus-Version, Tus-Extension, Tus-Max-Size" always;
    }

    # ── Upload endpoint (legacy chunked — kept for backward compatibility) ──
    location /api/upload/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ── WebSocket (Django Channels via Daphne) ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── All other requests → Daphne ASGI ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
