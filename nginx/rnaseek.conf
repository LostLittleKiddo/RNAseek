# ============================================================
# Nginx — RNAseek Production (rnaseek.ca)
# ============================================================
# Install: sudo ln -s /home/ubuntu/apps/rnaseek/nginx/rnaseek.conf /etc/nginx/sites-enabled/rnaseek.conf
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rnaseek.ca www.rnaseek.ca;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rnaseek.ca www.rnaseek.ca;

    # ── SSL (Let's Encrypt / Certbot) ──
    ssl_certificate /etc/letsencrypt/live/rnaseek.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rnaseek.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Limits ──
    # Set to 0 (unlimited) — tusd handles chunking; Nginx must not
    # reject large uploads at the proxy layer.
    client_max_body_size 0;
    client_body_timeout 600s;

    # ── Static files (served directly by Nginx, bypasses Django) ──
    location /static/ {
        alias /home/ubuntu/apps/rnaseek/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Tus resumable upload endpoint → tusd (port 1080) ──
    # CRITICAL: proxy_request_buffering MUST be off so Nginx streams
    # chunks directly to tusd without writing to local disk first.
    location /files/ {
        proxy_pass http://127.0.0.1:1080;

        # Stream-through: do NOT buffer the request body on disk.
        # Without this, Nginx spools the entire chunk to a temp file
        # before forwarding, which halves throughput on NFS.
        proxy_request_buffering off;

        # HTTP/1.1 enables chunked transfer encoding and keep-alive
        # to tusd, avoiding per-chunk connection overhead.
        proxy_http_version 1.1;

        # Tus protocol headers — tusd needs these to function correctly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Tus protocol: forward the raw Content-Type and
        # Upload metadata headers without modification.
        proxy_set_header Upload-Length $http_upload_length;
        proxy_set_header Upload-Offset $http_upload_offset;
        proxy_set_header Upload-Metadata $http_upload_metadata;
        proxy_set_header Tus-Resumable $http_tus_resumable;
        proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;

        # Generous timeouts for large genomic files (multi-GB).
        # 900s = 15 min per chunk — covers slow NFS writes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 30s;

        # Disable response buffering — let tusd stream responses back.
        proxy_buffering off;

        # Do not limit upload rate at the proxy layer.
        proxy_max_temp_file_size 0;
    }

    # ── Legacy upload endpoint (Django-handled uploads) ──
    location /api/upload/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ── WebSocket (Django Channels via Daphne) ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── All other requests → Daphne ASGI ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
